# Wallet-friendly local devnet: node + indexer + proof server on the FIXED
# ports Midnight wallets expect for the "Undeployed" network
# (node 9944, indexer 8088, proof server 6300).
#
#   docker compose -f devnet/devnet.yml up -d
#   docker compose -f devnet/devnet.yml down
#
# Point your wallet (Lace / Gero / 1AM) at:
#   network: Undeployed · proof server: http://localhost:6300
#
# SPDX-License-Identifier: Apache-2.0

services:
  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    command: ['midnight-proof-server', '-v']
    container_name: 'midnight-proof-server'
    ports:
      - '6300:6300'

  indexer:
    image: 'midnightntwrk/indexer-standalone:4.0.1'
    container_name: 'midnight-indexer'
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=info,info'
      # Random 32-byte hex-encoded secret used to make the standalone indexer run.
      # Only needed to satisfy the config schema – not meant for secure use.
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__NODE__URL: 'ws://node:9944'
    depends_on:
      node:
        condition: service_started

  node:
    image: 'midnightntwrk/midnight-node:0.22.3'
    container_name: 'midnight-node'
    ports:
      - '9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
